# =============================================================================
#  ONE-FILE AUTO PROFILE  -  lives at:  .github/workflows/profile.yml
#  (in your profile repo  uzairnasir0412/uzairnasir0412)
#
#  Rebuilds README.md and the cards in assets/ from live GitHub data:
#  every hour, when you run it manually, and whenever this file is edited.
#
#  To change your text or design, edit the TEMPLATE inside this file.
#  README.md is regenerated, so edits made directly to README.md are overwritten.
# =============================================================================
name: Auto Profile

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [project-updated]
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: auto-profile
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          """Builds the whole profile README + SVG cards from live GitHub data (stdlib only)."""
          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import sys
          import textwrap
          import urllib.error
          import urllib.request
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          USERNAME = os.getenv("GH_USERNAME") or os.getenv("GITHUB_REPOSITORY_OWNER") or "uzairnasir0412"
          TOKEN = os.getenv("GITHUB_TOKEN", "")
          API = "https://api.github.com"

          ROOT = Path.cwd()
          README = ROOT / "README.md"
          ASSETS = ROOT / "assets"

          MAX_PROJECTS = 6      # project cards shown (use an even number)
          MAX_EVENTS = 5        # lines in "Recent Activity"
          MAX_LANG_REPOS = 60   # repos scanned for the language chart

          FONT = "'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"

          LANG_COLORS = {
              "Python": "#3776AB", "Java": "#F89820", "C++": "#00599C", "C": "#A8B9CC",
              "C#": "#9B4F96", "JavaScript": "#F7DF1E", "TypeScript": "#3178C6",
              "HTML": "#E34F26", "CSS": "#1572B6", "PHP": "#777BB4", "Kotlin": "#7F52FF",
              "Dart": "#0175C2", "Go": "#00ADD8", "Rust": "#DEA584", "Shell": "#89E051",
              "Jupyter Notebook": "#DA5B0B", "SQL": "#E38C00", "PLpgSQL": "#336791",
              "Other": "#64748B",
          }
          FALLBACK_COLORS = ["#38BDF8", "#0891B2", "#6366F1", "#22D3EE", "#A78BFA", "#34D399", "#F472B6", "#FBBF24"]


          # --------------------------------------------------------------------------- #
          # GitHub API helpers
          # --------------------------------------------------------------------------- #
          def gh(path: str):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": f"{USERNAME}-profile-updater",
              }
              if TOKEN:
                  headers["Authorization"] = f"Bearer {TOKEN}"
              req = urllib.request.Request(API + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)


          def gh_safe(path: str, default):
              try:
                  return gh(path)
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                  print(f"warning: {path} failed: {exc}", file=sys.stderr)
                  return default


          def get_repos() -> list[dict]:
              """Public, non-fork, non-archived repos (excluding the profile repo), newest push first."""
              repos: list[dict] = []
              page = 1
              while True:
                  batch = gh(f"/users/{USERNAME}/repos?per_page=100&type=owner&sort=pushed&page={page}")
                  repos += batch
                  if len(batch) < 100:
                      break
                  page += 1
              repos = [
                  r for r in repos
                  if not r["fork"] and not r["archived"] and r["name"].lower() != USERNAME.lower()
              ]
              repos.sort(key=lambda r: r.get("pushed_at") or "", reverse=True)
              return repos


          def get_language_bytes(repos: list[dict]) -> Counter:
              totals: Counter = Counter()
              for r in repos[:MAX_LANG_REPOS]:
                  totals.update(gh_safe(f"/repos/{USERNAME}/{r['name']}/languages", {}))
              return totals


          # --------------------------------------------------------------------------- #
          # Utilities
          # --------------------------------------------------------------------------- #
          def esc(value) -> str:
              return html.escape(str(value), quote=True)


          def fmt_date(iso: str | None) -> str:
              if not iso:
                  return "-"
              d = datetime.strptime(iso, "%Y-%m-%dT%H:%M:%SZ")
              return f"{d.day} {d:%b %Y}"


          def lang_color(name: str) -> str:
              if name in LANG_COLORS:
                  return LANG_COLORS[name]
              return FALLBACK_COLORS[int(hashlib.md5(name.encode()).hexdigest()[:2], 16) % len(FALLBACK_COLORS)]


          def short_hash(text: str) -> str:
              return hashlib.md5(text.encode()).hexdigest()[:8]


          def write_if_changed(path: Path, content: str) -> bool:
              if path.exists() and path.read_text(encoding="utf-8") == content:
                  return False
              path.write_text(content, encoding="utf-8")
              return True


          # --------------------------------------------------------------------------- #
          # SVG cards (generated, so they never depend on third-party servers)
          # --------------------------------------------------------------------------- #
          GRADIENT = (
              '<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">'
              '<stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#38BDF8"/>'
              '</linearGradient></defs>'
          )


          def build_project_svg(r: dict) -> str:
              W, H = 420, 160
              name = r["name"] if len(r["name"]) <= 30 else r["name"][:29] + "…"
              desc = (r.get("description") or "").strip()
              lines = textwrap.wrap(desc, width=50, max_lines=2, placeholder="…") if desc else []

              out = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" '
                  f'role="img" aria-label="{esc(r["name"])}">',
                  GRADIENT,
                  '<rect x="6" y="6" width="408" height="148" rx="14" fill="#0B1020" stroke="#172554" stroke-width="2"/>',
                  '<rect x="26" y="6" width="48" height="3" rx="1.5" fill="url(#accent)"/>',
                  f'<text x="26" y="44" fill="#F8FAFC" font-family="{FONT}" font-size="18" font-weight="700">{esc(name)}</text>',
              ]
              if lines:
                  for i, line in enumerate(lines):
                      out.append(f'<text x="26" y="{72 + i * 20}" fill="#94A3B8" font-family="{FONT}" font-size="13">{esc(line)}</text>')
              else:
                  out.append(f'<text x="26" y="72" fill="#64748B" font-family="{FONT}" font-size="13">No description yet.</text>')

              x = 26
              lang = r.get("language")
              if lang:
                  out.append(f'<circle cx="{x + 5}" cy="127" r="5" fill="{lang_color(lang)}"/>')
                  out.append(f'<text x="{x + 17}" y="132" fill="#E4E4E7" font-family="{FONT}" font-size="12">{esc(lang)}</text>')
                  x += 17 + int(7.2 * len(lang)) + 18
              if r.get("stargazers_count", 0) > 0:
                  out.append(f'<text x="{x}" y="132" fill="#38BDF8" font-family="{FONT}" font-size="12">★ {r["stargazers_count"]}</text>')
              out.append(f'<text x="394" y="132" fill="#64748B" font-family="{FONT}" font-size="12" text-anchor="end">'
                         f'Updated {fmt_date(r.get("pushed_at"))}</text>')
              out.append("</svg>")
              return "\n".join(out)


          def build_languages_svg(totals: Counter) -> str:
              W, H = 840, 250
              out = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" '
                  f'role="img" aria-label="Most used languages">',
                  GRADIENT.replace("</defs>", '<clipPath id="bar"><rect x="40" y="78" width="760" height="14" rx="7"/></clipPath></defs>'),
                  f'<rect x="1" y="1" width="{W - 2}" height="{H - 2}" rx="18" fill="#0B1020" stroke="#172554" stroke-width="2"/>',
                  '<rect x="40" y="28" width="4" height="22" rx="2" fill="url(#accent)"/>',
                  f'<text x="54" y="46" fill="#F8FAFC" font-family="{FONT}" font-size="20" font-weight="700">Most Used Languages</text>',
              ]
              total = sum(totals.values())
              if not total:
                  out.append(f'<text x="40" y="130" fill="#94A3B8" font-family="{FONT}" font-size="15">No language data yet.</text></svg>')
                  return "\n".join(out)

              top = totals.most_common(7)
              rest = total - sum(b for _, b in top)
              if rest > 0:
                  top.append(("Other", rest))

              out.append('<g clip-path="url(#bar)"><rect x="40" y="78" width="760" height="14" fill="#1E293B"/>')
              x = 40.0
              for name, size in top:
                  w = 760 * size / total
                  out.append(f'<rect x="{x:.2f}" y="78" width="{w + 0.5:.2f}" height="14" fill="{lang_color(name)}"/>')
                  x += w
              out.append("</g>")

              for i, (name, size) in enumerate(top):
                  col, row = i % 2, i // 2
                  lx, ly = 40 + col * 390, 128 + row * 28
                  out.append(f'<circle cx="{lx + 6}" cy="{ly - 5}" r="6" fill="{lang_color(name)}"/>')
                  out.append(f'<text x="{lx + 22}" y="{ly}" fill="#E4E4E7" font-family="{FONT}" font-size="15">{esc(name)}</text>')
                  out.append(f'<text x="{lx + 340}" y="{ly}" fill="#94A3B8" font-family="{FONT}" font-size="15" '
                             f'text-anchor="end">{100 * size / total:.1f}%</text>')
              out.append("</svg>")
              return "\n".join(out)


          def build_stats_svg(user: dict, repos: list[dict], n_langs: int) -> str:
              W, H = 840, 150
              items = [
                  ("Repositories", len(repos)),
                  ("Stars Earned", sum(r["stargazers_count"] for r in repos)),
                  ("Followers", user.get("followers", 0)),
                  ("Languages", n_langs),
              ]
              out = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" '
                  f'role="img" aria-label="GitHub statistics">',
                  GRADIENT,
                  f'<rect x="1" y="1" width="{W - 2}" height="{H - 2}" rx="18" fill="#0B1020" stroke="#172554" stroke-width="2"/>',
              ]
              for i, (label, value) in enumerate(items):
                  x = 40 + i * 195
                  out.append(f'<rect x="{x}" y="30" width="175" height="90" rx="14" fill="#111A33" stroke="#1E3A5F"/>')
                  out.append(f'<rect x="{x + 16}" y="30" width="40" height="3" rx="1.5" fill="url(#accent)"/>')
                  out.append(f'<text x="{x + 87}" y="80" fill="#38BDF8" font-family="{FONT}" font-size="34" '
                             f'font-weight="700" text-anchor="middle">{esc(value)}</text>')
                  out.append(f'<text x="{x + 87}" y="104" fill="#94A3B8" font-family="{FONT}" font-size="13" '
                             f'letter-spacing="1" text-anchor="middle">{esc(label.upper())}</text>')
              out.append("</svg>")
              return "\n".join(out)


          # --------------------------------------------------------------------------- #
          # README sections
          # --------------------------------------------------------------------------- #
          def render_current(repos: list[dict]) -> str:
              if not repos:
                  return ""
              r = repos[0]
              desc = f" — {r['description']}" if r.get("description") else ""
              return f"Currently working on [**{r['name']}**]({r['html_url']}){desc}"


          def render_projects(repos: list[dict], base: str) -> str:
              top = repos[:MAX_PROJECTS]
              ASSETS.mkdir(exist_ok=True)
              for old in ASSETS.glob("project-*.svg"):          # remove cards that are no longer needed
                  try:
                      if int(old.stem.split("-")[1]) > len(top):
                          old.unlink()
                  except ValueError:
                      pass
              if not top:
                  return "Projects will appear here as soon as I publish my first repository."

              anchors = []
              for i, r in enumerate(top, 1):
                  svg = build_project_svg(r)
                  write_if_changed(ASSETS / f"project-{i}.svg", svg)
                  anchors.append(
                      f'<a href="{esc(r["html_url"])}"><img src="{base}/project-{i}.svg?v={short_hash(svg)}" '
                      f'alt="{esc(r["name"])}" width="48%"/></a>'
                  )
              rows = ["\n".join(anchors[i:i + 2]) for i in range(0, len(anchors), 2)]
              return '<div align="center">\n\n' + "\n<br/>\n".join(rows) + "\n\n</div>"


          def describe_event(e: dict) -> tuple[str, str] | None:
              repo = e["repo"]["name"]
              if repo.lower() == f"{USERNAME}/{USERNAME}".lower():
                  return None  # ignore the profile repo itself (bot commits)
              link = f"[{repo}](https://github.com/{repo})"
              p = e.get("payload", {})
              t = e["type"]

              if t == "PushEvent":
                  n = p.get("size") or len(p.get("commits", []) or [])
                  text = f"Pushed {n} commit{'s' if n != 1 else ''} to {link}" if n else f"Pushed to {link}"
              elif t == "CreateEvent" and p.get("ref_type") == "repository":
                  text = f"Created repository {link}"
              elif t == "PullRequestEvent" and p.get("action") in ("opened", "closed"):
                  merged = p.get("pull_request", {}).get("merged")
                  text = f"Merged a pull request in {link}" if merged else f"{p['action'].capitalize()} a pull request in {link}"
              elif t == "IssuesEvent" and p.get("action") == "opened":
                  text = f"Opened an issue in {link}"
              elif t == "ReleaseEvent":
                  text = f"Published a release in {link}"
              elif t == "PublicEvent":
                  text = f"Made {link} public"
              else:
                  return None
              return f"{t}:{repo}", f"- {text} · `{fmt_date(e['created_at'])}`"


          def render_activity() -> str:
              events = gh_safe(f"/users/{USERNAME}/events/public?per_page=100", [])
              seen, lines = set(), []
              for e in events:
                  item = describe_event(e)
                  if not item or item[0] in seen:
                      continue
                  seen.add(item[0])
                  lines.append(item[1])
                  if len(lines) >= MAX_EVENTS:
                      break
              return "\n".join(lines) if lines else "No recent public activity."


          # --------------------------------------------------------------------------- #
          # EDIT ME: your profile text lives here. Everything between the triple quotes
          # is your README; @@PLACEHOLDERS@@ are filled in automatically.
          # Commit this file and the README rebuilds itself.
          # --------------------------------------------------------------------------- #
          LINKEDIN_URL = "https://www.linkedin.com/"   # <- put your real LinkedIn link here

          TEMPLATE = r"""<div align="center">

          <img src="https://capsule-render.vercel.app/api?type=waving&color=0:09090B,50:172554,100:0891B2&height=220&section=header&text=UZAIR%20NASIR&fontSize=55&fontColor=FFFFFF&fontAlignY=38&desc=Computer%20Science%20Student%20%7C%20Software%20Developer&descSize=16&descAlignY=60&animation=fadeIn" width="100%"/>

          </div>

          ## About

          I'm a Computer Science student at COMSATS University Islamabad, focused on software development, artificial intelligence and machine learning. I learn by building: my projects so far span Python applications, Java object-oriented design, C++ data structures, database systems and web development.

          @@CURRENT@@

          ## Featured Projects

          @@PROJECTS@@

          [View all repositories →](https://github.com/uzairnasir0412?tab=repositories)

          ## Tech Stack

          <img src="https://skillicons.dev/icons?i=java,cpp,python,javascript,html,css,mysql,mongodb,git,github,vscode,idea&theme=dark" alt="Tech stack"/>

          ## Coursework

          | Area | Subjects |
          |:--|:--|
          | Artificial Intelligence & ML | Artificial Intelligence & RAG Applications, Machine Learning |
          | Core Computer Science | Data Structures & Algorithms, Object-Oriented Programming, Operating Systems |
          | Databases | Database Systems, Advanced Database (MongoDB) |
          | Web | Web Development (HTML, CSS, JavaScript) |

          ## GitHub Overview

          @@STATS@@

          ## Recent Activity

          @@ACTIVITY@@

          ## Contact

          <a href="https://github.com/uzairnasir0412"><img src="https://img.shields.io/badge/GitHub-uzairnasir0412-181717?style=flat-square&logo=github&logoColor=white" alt="GitHub"/></a>
          <a href="@@LINKEDIN@@"><img src="https://img.shields.io/badge/LinkedIn-Connect-0A66C2?style=flat-square&logo=linkedin&logoColor=white" alt="LinkedIn"/></a>

          <img src="https://capsule-render.vercel.app/api?type=waving&color=0:0891B2,50:172554,100:09090B&height=100&section=footer" width="100%"/>
          """


          def main() -> None:
              user = gh(f"/users/{USERNAME}")
              repos = get_repos()
              totals = get_language_bytes(repos)
              default_branch = gh_safe(f"/repos/{USERNAME}/{USERNAME}", {}).get("default_branch", "main")
              base = f"https://raw.githubusercontent.com/{USERNAME}/{USERNAME}/{default_branch}/assets"

              ASSETS.mkdir(exist_ok=True)
              stats_svg = build_stats_svg(user, repos, len(totals))
              langs_svg = build_languages_svg(totals)
              write_if_changed(ASSETS / "stats.svg", stats_svg)
              write_if_changed(ASSETS / "languages.svg", langs_svg)

              stats_md = (
                  '<div align="center">\n\n'
                  f'<img src="{base}/stats.svg?v={short_hash(stats_svg)}" alt="GitHub statistics" width="100%"/>\n\n'
                  f'<img src="{base}/languages.svg?v={short_hash(langs_svg)}" alt="Most used languages" width="100%"/>\n\n'
                  '</div>'
              )

              out = (
                  TEMPLATE.replace("@@CURRENT@@", render_current(repos))
                  .replace("@@PROJECTS@@", render_projects(repos, base))
                  .replace("@@STATS@@", stats_md)
                  .replace("@@ACTIVITY@@", render_activity())
                  .replace("@@LINKEDIN@@", LINKEDIN_URL)
              )
              print("README updated." if write_if_changed(README, out) else "README already up to date.")


          if __name__ == "__main__":
              main()

          PY

      - name: Commit changes (only if something changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: auto-update profile"
            git push
          fi
